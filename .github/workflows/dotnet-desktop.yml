name: Deploy FolderFlex

on:
  push:
    branches: ['master']
    paths-ignore:
      - 'README.md'
      - 'social_preview.jpg'
      - 'docs/**'
      - '.github/workflows/dotnet-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Sincronizando Repositório
        uses: actions/checkout@v4

      - name: Configurando Ambiente .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restaurando Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurando Dependências
        run: dotnet restore FolderFlex.slnx

      - name: Compilando Solução
        run: dotnet build FolderFlex.slnx --configuration Release --no-restore

      - name: Publicando FolderFlex
        run: dotnet publish FolderFlex/FolderFlex.csproj --configuration Release --output ./output/FolderFlexFiles

      - name: Compactando Release
        shell: pwsh
        run: Compress-Archive -Path ./output/FolderFlexFiles -DestinationPath ./output/FolderFlex.zip

      - name: Criando Tag e Release no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          gh release create $tag ./output/FolderFlex.zip --title "FolderFlex $tag" --prerelease --generate-notes
